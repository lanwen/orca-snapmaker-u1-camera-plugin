<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Snapmaker U1</title><style>
:root { color-scheme:dark; font:14px system-ui,sans-serif; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0b0e12; color:#fff; }
.viewer { position:fixed; inset:0; isolation:isolate; background:#0b0e12; }
#image { width:100%; height:100%; object-fit:contain; display:block; }
header { position:absolute; inset:0 0 auto; padding:26px 30px 50px; display:flex; align-items:start; justify-content:space-between; gap:24px; background:linear-gradient(#0009,transparent); z-index:3; pointer-events:none; }
h1 { font-size:19px; font-weight:600; margin:0 0 5px; letter-spacing:-.3px; }
#target { font-size:12px; color:#ffffffa0; overflow-wrap:anywhere; }
#printer { margin-left:10px; font-size:12px; font-weight:400; color:#ffffffb0; }
button { font:inherit; color:inherit; cursor:pointer; border:0; }
button:disabled { opacity:.5; cursor:default; }
button:focus-visible { outline:3px solid #68ddbd; outline-offset:5px; }
#light { pointer-events:auto; display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid #ffffff30; border-radius:999px; background:#161c24b3; backdrop-filter:blur(12px); white-space:nowrap; }
.track { display:inline-flex; align-items:center; width:38px; height:22px; padding:3px; background:#ffffff35; border-radius:99px; transition:background .15s; }
.thumb { width:16px; height:16px; border-radius:50%; background:white; transition:transform .15s; }
#light[aria-checked="true"] .track { background:#249b7c; }
#light[aria-checked="true"] .thumb { transform:translateX(16px); }
#play,#warning { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:radial-gradient(ellipse at center,#26313c80,transparent 70%); z-index:2; }
#warning { color:#f3c568; padding:30px; text-align:center; pointer-events:none; }
#warning svg { width:64px; height:64px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.play-circle { width:88px; height:88px; border:1px solid #ffffff4d; border-radius:50%; display:grid; place-items:center; background:#ffffff10; transition:background .15s,transform .15s; }
#play:hover .play-circle { background:#ffffff20; transform:scale(1.04); }
#play svg { width:30px; height:30px; margin-left:5px; fill:currentColor; }
.play-label { font-size:15px; color:#e0e5ec; max-width:480px; padding:0 24px; }
#empty { position:absolute; inset:0; display:grid; place-items:center; color:#ffffff80; pointer-events:none; }
footer { position:absolute; inset:auto 0 0; padding:36px 30px 24px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:12px 20px; background:linear-gradient(transparent,#0009); z-index:3; pointer-events:none; }
#stats { grid-column:1 / -1; display:grid; grid-template-columns:100px minmax(0,1fr) 185px; gap:18px; width:666px; max-width:100%; padding:16px; border:1px solid transparent; border-radius:14px; background:transparent; pointer-events:auto; font-variant-numeric:tabular-nums; text-shadow:0 1px 4px #0009; }
#stats:hover,#stats:focus-visible { border-color:#ffffff26; background:#111820e8; box-shadow:0 8px 32px #0003; backdrop-filter:blur(18px); }
#stats:focus-visible { outline:2px solid #7abaff; outline-offset:3px; }
.stats-gauge { display:flex; flex-direction:column; justify-content:center; gap:8px; }
#stats-title { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
#stats-state { display:inline-flex; align-items:center; gap:6px; color:#d5dee7; font-size:11px; font-weight:500; }
#stats-state::before { content:''; width:5px; height:5px; border-radius:50%; background:#96a4b3; }
#stats[data-state="printing"] #stats-state::before { background:#7abaff; }
#stats[data-state="preparing"] #stats-state::before { background:#a0cbff; }
#stats[data-state="complete"] #stats-state::before { background:#72dec2; }
#stats[data-state="paused"] #stats-state::before { background:#f1c675; }
#stats[data-state="error"] #stats-state::before { background:#ff9999; }
#progress-value { font-size:42px; font-weight:550; letter-spacing:-2px; line-height:1; }
.layers { color:#c0cbd5; font-size:10px; }
#layers-value { margin-left:4px; }
.stats-journey { display:flex; flex-direction:column; justify-content:center; gap:10px; border-left:1px solid #ffffff28; padding-left:18px; }
#remaining-stat { display:flex; align-items:baseline; gap:7px; }
#remaining-value { font-size:22px; font-weight:550; letter-spacing:-.6px; }
#remaining-stat span { color:#c0cbd5; font-size:10px; }
#progress-bar { height:4px; overflow:hidden; border-radius:99px; background:#ffffff32; }
#progress-fill { display:block; width:0; height:100%; border-radius:inherit; background:#7abaff; }
#stats[data-state="complete"] #progress-fill { background:#72dec2; }
#stats[data-state="cancelled"] #progress-fill { background:#96a4b3; }
#stats[data-state="paused"] #progress-fill { background:#f1c675; }
#stats[data-state="error"] #progress-fill { background:#ff9999; }
.stats-times { display:flex; justify-content:space-between; gap:10px; margin:0; }
#stats dt { margin-bottom:4px; color:#c0cbd5; font-size:10px; line-height:1.2; }
#stats dd { margin:0; color:#edf3f9; font-size:12px; font-weight:500; line-height:1.3; }
#stats #finish-value { overflow-wrap:anywhere; }
.stats-details { display:grid; align-content:center; gap:10px; border-left:1px solid #ffffff28; padding-left:18px; }
.material { display:flex; align-items:center; gap:8px; font-size:12px; }
#tool-value { display:inline-block; padding:3px 6px; border:1px solid #ffffff60; border-bottom-width:2px; border-radius:5px; background:#ffffff0d; font-size:11px; font-weight:600; line-height:1; }
#material-value { overflow-wrap:anywhere; }
#material-swatch { flex:0 0 10px; width:10px; height:10px; border:1px solid #ffffff80; border-radius:3px; background:transparent; }
.temperatures { display:grid; gap:7px; margin:0; }
.temperatures > div { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
#stats .temperatures dt { margin:0; }
#stats .temperatures dd { white-space:nowrap; }
#stats:is([data-state="complete"],[data-state="paused"],[data-state="cancelled"],[data-state="error"]) { width:540px; grid-template-columns:100px minmax(0,1fr) 180px; }
#stats[data-state="standby"] { width:320px; grid-template-columns:1fr 1fr; }
#stats[data-state="preparing"] { width:560px; grid-template-columns:minmax(0,1fr) 185px; }
#stats[data-state="unavailable"] { width:360px; grid-template-columns:1fr; }
#stats-message { font-size:16px; font-weight:500; line-height:1.4; }
#stats[data-state="preparing"] #stats-message { font-size:22px; }
@media(max-width:650px) {
  #stats,#stats:is([data-state="complete"],[data-state="paused"],[data-state="cancelled"],[data-state="error"],[data-state="preparing"]) { width:480px; grid-template-columns:90px minmax(0,1fr); gap:12px; }
  #progress-value { font-size:36px; }
  #stats[data-state="preparing"] .stats-gauge { grid-column:1 / -1; }
  .stats-journey { padding-left:12px; }
  .stats-details { grid-column:1 / -1; border-left:0; border-top:1px solid #ffffff28; padding:10px 0 0; grid-template-columns:minmax(0,1fr) minmax(0,2fr); align-items:center; }
  .temperatures { grid-template-columns:1fr 1fr; gap:12px; }
  .temperatures > div { display:block; }
  #stats .temperatures dt { margin-bottom:4px; }
  #stats[data-state="standby"] .stats-details { grid-column:auto; border-top:0; border-left:1px solid #ffffff28; padding:0 0 0 12px; grid-template-columns:1fr; }
  #stats[data-state="standby"] .temperatures { grid-template-columns:1fr; }
}
@media(max-width:420px) { .stats-details { grid-template-columns:1fr; } }
#camera { font-size:12px; color:#d7dee7; line-height:1.5; }
#stop { pointer-events:auto; display:flex; align-items:center; gap:9px; padding:10px 16px; border:1px solid #ffffff40; border-radius:999px; background:#17202bd9; opacity:0; transition:opacity .15s; }
#stop svg { width:12px; height:12px; fill:currentColor; }
.viewer:hover #stop,.viewer:focus-within #stop { opacity:1; }
@media(hover:none) { #stop { opacity:1; } }
@media(max-width:550px) { header { padding:18px; } footer { padding:36px 18px 18px; } #light { gap:8px; padding:8px 10px; } #target { max-width:180px; } }
</style></head><body>
<main class="viewer" aria-label="Snapmaker U1 camera">
<img id="image" alt="Snapmaker U1 camera" hidden>
<header><div><h1>Snapmaker U1 <span id="printer">Connecting</span></h1><div id="target">Selected printer</div></div>
<button id="light" type="button" role="switch" aria-label="Chamber light" aria-checked="false" disabled>
<span>Light</span><span class="track" aria-hidden="true"><span class="thumb"></span></span></button></header>
<button id="play" type="button" aria-label="Play camera" disabled><span class="play-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18l16-9z"/></svg></span><span id="play-label" class="play-label">Play camera</span></button>
<div id="warning" role="status" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20zM12 9v5m0 3v.01"/></svg><span id="warning-label">Set the printer address in plugin Config.</span></div>
<div id="empty" hidden>Connecting to camera…</div>
<footer>
<section id="stats" aria-labelledby="stats-title" tabindex="0" hidden>
<h2 id="stats-title">Print statistics</h2>
<div class="stats-gauge">
<span id="stats-state">Unknown</span>
<span id="stats-message" hidden></span>
<strong id="progress-value">—</strong>
<div id="layers-stat" class="layers">Layers<span id="layers-value">— / —</span></div>
</div>
<div id="journey-stat" class="stats-journey">
<div id="remaining-stat"><strong id="remaining-value">—</strong><span>left</span></div>
<div id="progress-bar" role="progressbar" aria-label="Print progress" aria-valuemin="0" aria-valuemax="100"><span id="progress-fill"></span></div>
<dl class="stats-times">
<div><dt>Elapsed</dt><dd id="elapsed-value">—</dd></div>
<div id="finish-stat"><dt>Est. finish</dt><dd id="finish-value">—</dd></div>
</dl>
</div>
<div id="hardware-stat" class="stats-details">
<div id="material-stat" class="material"><span id="tool-stat"><span id="tool-value" title="Toolhead">—</span></span><span id="material-value">—</span><span id="material-swatch" aria-hidden="true"></span></div>
<dl class="temperatures">
<div><dt id="bed-label">Bed</dt><dd id="bed-value">— °C</dd></div>
<div><dt id="hotend-label">Hotend</dt><dd id="hotend-value">— °C</dd></div>
</dl>
</div>
</section>
<div id="camera" role="status"></div><button id="stop" type="button" hidden aria-label="Stop camera"><svg viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" rx="2"/></svg>Stop</button>
</footer>
</main><script>
window.addEventListener('error', event => {
  document.getElementById('camera').textContent = 'Player error: ' + event.message;
});
</script><script>
const $ = id => document.getElementById(id);
let active = false, playing = false, supported = false, targetUnavailable = false, generation = -1, lastFrame = 0, light = null;
let statsAt = 0;
const number = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
function duration(value) {
  if (!number(value)) return '—';
  const minutes = Math.floor(value / 60);
  return value === 0 ? '0m' : minutes < 1 ? '<1m' : (minutes >= 60 ? Math.floor(minutes / 60) + 'h ' : '') + minutes % 60 + 'm';
}
function temperature(value = {}, showTarget = true) {
  const degrees = item => number(item) ? Math.round(item) : '—';
  const target = showTarget && number(value.target) && value.target > 0 &&
    (!number(value.temperature) || Math.abs(value.temperature - value.target) > 2);
  return degrees(value.temperature) + (target ? ' / ' + degrees(value.target) : '') + ' °C';
}
function renderStats(stats, unavailable = false) {
  if (!stats && unavailable) stats = {state:'unavailable'};
  $('stats').hidden = !stats;
  statsAt = stats && stats.state !== 'unavailable' ? Date.now() : 0;
  if (!stats) return;
  // No extrusion time or first layer yet: preparation, even if the file has started.
  const preparing = stats.state === 'printing' && stats.printing_duration === 0 &&
    (!number(stats.current_layer) || stats.current_layer === 0);
  const state = preparing ? 'preparing' : stats.state;
  const states = {printing:'Printing', preparing:'Preparing', paused:'Paused', complete:'Complete', error:'Error', cancelled:'Cancelled', standby:'Standby', unavailable:'Status unavailable'};
  $('stats-state').textContent = states[state] || 'Unknown';
  $('stats').setAttribute('data-state', state);
  const printing = state === 'printing';
  const standby = state === 'standby';
  const missing = state === 'unavailable';
  const terminal = state === 'complete' || state === 'cancelled' || state === 'error';
  const heating = [stats.bed, stats.hotend].some(value => value && number(value.temperature) &&
    number(value.target) && value.target - value.temperature > 2);
  $('stats-message').textContent = missing ? 'Waiting for status' : standby ? 'No print running' :
    preparing ? (heating ? 'Heating up' : 'Preparing to print') : '';
  $('stats-message').hidden = !missing && !standby && !preparing;
  for (const id of ['remaining-stat', 'finish-stat']) $(id).hidden = !printing;
  $('tool-stat').hidden = terminal || standby;
  $('material-stat').hidden = standby || state === 'error';
  $('hardware-stat').hidden = missing;
  for (const id of ['progress-value', 'layers-stat', 'journey-stat']) $(id).hidden = standby || preparing || missing;
  const progress = number(stats.progress) ? Math.min(100, stats.progress * 100) : null;
  $('progress-value').textContent = progress === null ? '—' : Math.floor(progress) + '%';
  $('progress-fill').style.width = (progress ?? 0) + '%';
  if (progress === null) $('progress-bar').removeAttribute('aria-valuenow');
  else $('progress-bar').setAttribute('aria-valuenow', String(Math.floor(progress)));
  $('progress-bar').setAttribute('aria-valuetext', progress === null ? 'Progress unavailable' : Math.floor(progress) + '% complete');
  const layer = value => number(value) ? Math.floor(value).toLocaleString() : '—';
  $('layers-value').textContent = layer(stats.current_layer) + ' / ' + layer(stats.total_layer);
  $('elapsed-value').textContent = duration(stats.elapsed);
  $('remaining-value').textContent = number(stats.remaining) ? '≈ ' + duration(stats.remaining) : '—';
  const finish = stats.state === 'printing' && number(stats.remaining) ? new Date(Date.now() + stats.remaining * 1000) : null;
  const today = new Date().toDateString();
  $('finish-value').textContent = finish && Number.isFinite(finish.getTime()) ?
    (finish.toDateString() === today ? '' : finish.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ', ') +
    finish.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}) : '—';
  $('tool-value').textContent = Number.isInteger(stats.tool) && stats.tool >= 0 && stats.tool < 4 ? 'T' + stats.tool : '—';
  const color = typeof stats.color === 'string' && /^#[0-9a-f]{6}$/i.test(stats.color) ? stats.color.toUpperCase() : null;
  $('material-value').textContent = stats.material || 'Unknown material';
  $('material-swatch').style.backgroundColor = color || 'transparent';
  $('material-swatch').hidden = !color;
  $('bed-value').textContent = temperature(stats.bed, !terminal && !standby);
  $('hotend-value').textContent = temperature(stats.hotend, !terminal && !standby);
}
function clearImage() {
  $('image').hidden = true;
  $('image').removeAttribute('src');
}
function playbackControls() {
  $('play').hidden = playing || targetUnavailable;
  $('warning').hidden = !targetUnavailable;
  $('stop').hidden = !playing;
  $('empty').hidden = !playing;
}
function stopPlayback() {
  playing = false;
  clearImage();
  playbackControls();
  $('camera').textContent = '';
}
function tick() {
  if (statsAt && Date.now() - statsAt > 10000) renderStats(null, true);
  if (document.hidden) {
    if (active) {
      stopPlayback(); active = false;
      $('light').disabled = true;
      orca.postMessage({type:'activity', active:false});
    }
    return;
  }
  active = true;
  if (playing && Date.now() - lastFrame > 6000) {
    clearImage(); $('empty').hidden = false;
    $('camera').textContent = 'Waiting for camera — no recent image';
  }
  orca.postMessage({type:'activity', active:true, playing});
}
orca.onMessage(data => {
  if (!active) return;
  if (data.type === 'selection_changed') {
    renderStats(null);
    stopPlayback(); supported = false; $('play').disabled = true; $('light').disabled = true;
    tick(); return;
  }
  if (data.type === 'target') {
    supported = true; targetUnavailable = false; $('play').disabled = false;
    $('play').hidden = playing; $('warning').hidden = true;
    $('play-label').textContent = 'Play camera';
    if (generation !== data.generation) {
      clearImage(); lastFrame = Date.now();
      $('empty').hidden = !playing;
    }
    if ($('target').textContent !== data.target) {
      renderStats(null);
      $('printer').textContent = 'Connecting';
      light = null; $('light').disabled = true;
    }
    generation = data.generation; $('target').textContent = data.target;
    return;
  }
  if (data.generation !== undefined && data.generation !== generation) return;
  if (data.error) {
    renderStats(null);
    if (typeof data.supported === 'boolean') {
      targetUnavailable = true;
      stopPlayback(); supported = false; $('play').disabled = true;
      $('target').textContent = 'Printer address unavailable'; $('printer').textContent = 'Unavailable';
      $('warning-label').textContent = data.error;
    }
    clearImage(); $('light').disabled = true;
    $('camera').textContent = data.error; return;
  }
  if (data.printer) $('printer').textContent = data.printer;
  if ('stats' in data) renderStats(data.stats, true);
  if ('light' in data) {
    light = data.light;
    $('light').disabled = light === null;
    $('light').setAttribute('aria-checked', String(light === true));
  }
  if (data.camera && (playing || data.failed)) $('camera').textContent = data.camera;
  if (data.failed) { clearImage(); $('empty').hidden = false; }
  if (!playing) { $('empty').hidden = true; return; }
  if (data.image) {
    const frameGeneration = data.generation;
    const acknowledge = () => {
      if (active && playing && generation === frameGeneration)
        orca.postMessage({type:'frame', generation:frameGeneration});
    };
    $('image').onload = () => {
      if (active && playing && generation === frameGeneration) {
        lastFrame = Date.now(); $('image').hidden = false; $('empty').hidden = true;
      }
      acknowledge();
    };
    $('image').onerror = () => {
      clearImage(); $('camera').textContent = 'Could not display camera image';
      acknowledge();
    };
    $('image').src = data.image;
  }
});
$('play').onclick = () => {
  if (document.hidden || !supported) return;
  playing = true; lastFrame = Date.now();
  playbackControls(); $('camera').textContent = 'Connecting…'; tick();
};
$('stop').onclick = () => { stopPlayback(); tick(); };
$('light').onclick = () => {
  if (active && !document.hidden && light !== null)
    orca.postMessage({type:'light', enabled:!light});
};
document.addEventListener('visibilitychange', tick);
window.addEventListener('pageshow', tick);
window.addEventListener('pagehide', () => {
  stopPlayback(); active = false;
  orca.postMessage({type:'activity', active:false});
});
setInterval(tick, 1000);
tick();
</script></body></html>
