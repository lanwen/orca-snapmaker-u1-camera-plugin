[project]
name = "orca-snapmaker-u1-camera-plugin"
version = "0.8.1"
description = "A dedicated U1 camera tab with playback and chamber light controls."
authors = [{ name = "lanwen" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["websocket-client==1.9.2"]

[tool.uv]
package = false
exclude-newer = "3 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
