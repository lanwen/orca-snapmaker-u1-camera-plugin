[tools]
python = "3.12.14"
node = "24.22.1"
uv = "0.12.18"
pnpm = "12.16.1"

[tasks.setup]
description = "Install locked development dependencies"
run = ["uv sync --locked --python python", "pnpm install --frozen-lockfile", "git config --local core.hooksPath .githooks"]

[tasks.build]
description = "Build the installable plugin and SHA256SUMS in dist/"
depends = ["setup"]
run = "python scripts/build.py"

[tasks."screenshots:prepare"]
description = "Prepare the all-states UI preview and four screenshot views"
depends = ["build"]
run = "python scripts/prepare_screenshots.py"

[tasks."screenshots:review"]
description = "Review prepared UI states in headless Chrome without rebuilding"
run = "uv run --no-sync python scripts/review_preview.py"

[tasks.test]
description = "Test the built plugin and camera page"
depends = ["setup", "build"]
run = ["uv run --no-sync python -m unittest discover -s tests -v", "pnpm run check", "pnpm test"]

[tasks.check]
description = "Run all checks"
depends = ["test"]
run = "git diff --check"

[tasks.release]
description = "Publish the current final version as an immutable GitHub release"
depends = ["check"]
run = "python scripts/release.py publish"

[tasks."release:info"]
description = "Print the current version and whether it is final"
run = "python scripts/release.py info"

[tasks."release:publish-cloud"]
description = "Publish the verified GitHub release to Orca Cloud using GitHub Actions OIDC"
run = "python scripts/publish_cloud.py"

[tasks."release:prepare-pr"]
description = "Prepare local release or next-development PR changes"
depends = ["setup"]
run = "python scripts/release.py prepare-pr"

[tasks."release:check-pr"]
description = "Check the PR title and development/release version policy"
run = "python scripts/release.py check-pr"

[tasks."release:classify-pr"]
description = "Identify an exact generated snapshot bump for code checks"
run = "python scripts/release.py classify-pr"

[tasks."release:merge-snapshot"]
description = "Merge the generated snapshot PR after its checks pass"
run = "python scripts/release.py merge-snapshot"
