name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - name: Identify exact snapshot version bump
        id: snapshot
        if: github.event_name == 'pull_request'
        run: mise run release:classify-pr
      - name: Measure first Chrome launch
        run: |
          mise run setup
          mkdir -p dist/cold-browser
          mise exec -- uv run --no-sync python scripts/probe_cold_browser.py | tee dist/cold-browser/measurement.jsonl
      - name: Save cold browser measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cold-browser-measurement
          path: dist/cold-browser/measurement.jsonl
      - run: mise run check
        if: steps.snapshot.outputs.snapshot_only != 'true'
      - name: Verify snapshot diff
        if: steps.snapshot.outputs.snapshot_only == 'true'
        run: git diff --check HEAD^ HEAD
