name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - name: Identify exact snapshot version bump
        id: snapshot
        if: github.event_name == 'pull_request'
        run: mise run release:classify-pr
      - name: Probe Linux browser startup
        if: steps.snapshot.outputs.snapshot_only != 'true'
        timeout-minutes: 4
        run: |
          mise run setup
          mise exec -- uv run --no-sync python scripts/probe_browser_startup.py
      - run: mise run check
        if: steps.snapshot.outputs.snapshot_only != 'true'
      - name: Verify snapshot diff
        if: steps.snapshot.outputs.snapshot_only == 'true'
        run: git diff --check HEAD^ HEAD
