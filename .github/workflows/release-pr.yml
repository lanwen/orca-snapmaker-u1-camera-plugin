name: Release and snapshot PRs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [release, snapshot]
        default: release
      release_version:
        description: Published version for snapshot preparation
        type: string
        required: false
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      release_version:
        type: string
        required: false
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: version-pr-${{ inputs.mode || 'release' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - name: Prepare version changes
        id: prepare
        run: |
          gh label create release --color 0e8a16 --description "Release preparation" --force
          gh label create snapshot --color 8250df --description "Development version" --force
          mise run release:prepare-pr >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ inputs.mode || 'release' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
      - name: Open or update version PR
        id: version-pr
        if: steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: ${{ steps.prepare.outputs.branch }}
          base: main
          delete-branch: true
          commit-message: ${{ steps.prepare.outputs.title }}
          title: ${{ steps.prepare.outputs.title }}
          body-path: dist/automation-pr-body.md
          labels: ${{ steps.prepare.outputs.label }}
          add-paths: |
            pyproject.toml
            uv.lock
            CHANGELOG.md
      - name: Merge snapshot PR after checks pass
        if: steps.prepare.outputs.branch == 'automation/next-snapshot' && steps.version-pr.outputs.pull-request-number != ''
        run: mise run release:merge-snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CHECKS_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_PR: ${{ steps.version-pr.outputs.pull-request-number }}
          SNAPSHOT_HEAD_SHA: ${{ steps.version-pr.outputs.pull-request-head-sha }}
          SNAPSHOT_VERSION: ${{ steps.prepare.outputs.version }}
