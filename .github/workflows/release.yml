name: Publish release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      final: ${{ steps.version.outputs.final }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - run: mise run check
      - id: version
        run: mise run release:info >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.final == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          cache: false
      - run: mise run release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

  next-snapshot:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.final == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-pr.yml
    with:
      mode: snapshot
      release_version: ${{ needs.validate.outputs.version }}
    secrets: inherit
